[project]
name = "ycgs-titiler"
version = "0.1.0"
description = "YCGS titiler deployment: titiler-cmr + titiler.xarray with dataset presets"
requires-python = ">=3.14,<3.15"
dependencies = [
    "titiler.cmr @ git+https://github.com/developmentseed/titiler-cmr@v1.1.3",
    "titiler.xarray[fs]>=2.4,<3",
    "titiler.core>=2.4,<3",
    "mangum==0.19.0",
    "pyyaml>=6",
    "cachetools>=6",
    "boto3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "uvicorn>=0.30", "boto3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ycgs_titiler"]

[tool.pytest.ini_options]
markers = ["live: hits real public data over the network (opt-in: -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
